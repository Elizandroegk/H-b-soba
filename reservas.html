<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas - Hospedaria B-SOBA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="admin-wrapper">
      
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-home"></i> B-SOBA Admin</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
                <a href="clientes.html" class="nav-item">
                    <i class="fas fa-users"></i> Clientes
                </a>
                <a href="quartos.html" class="nav-item">
                    <i class="fas fa-bed"></i> Quartos
                </a>
                <a href="reservas.html" class="nav-item active">
                    <i class="fas fa-calendar-check"></i> Reservas
                </a>
                <a href="pagamentos.html" class="nav-item">
                    <i class="fas fa-credit-card"></i> Pagamentos
                </a>
                <a href="relatorios.html" class="nav-item">
                    <i class="fas fa-chart-bar"></i> Relatórios
                </a>
                <a href="index.html" class="nav-item logout">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <h1>📅 Gestão de Reservas</h1>
                <div class="user-info">
                    <span>Bem-vindo, Admin</span>
                    <i class="fas fa-user-circle"></i>
                </div>
            </header>

            <div class="admin-container">
                
                <div class="table-container">
                    <h2>➕ Nova Reserva</h2>
                    <form id="reservaForm" class="form-grid">
                        <div class="form-group">
                            <label for="id_cliente">Cliente *</label>
                            <select id="id_cliente" name="id_cliente" required>
                                <option value="">Selecione cliente...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="id_quarto">Quarto *</label>
                            <select id="id_quarto" name="id_quarto" required>
                                <option value="">Selecione quarto disponível...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="data_checkin">Data Check-in *</label>
                            <input type="date" id="data_checkin" name="data_checkin" required>
                        </div>
                        <div class="form-group">
                            <label for="data_checkout">Data Check-out *</label>
                            <input type="date" id="data_checkout" name="data_checkout" required>
                        </div>
                        <div class="form-group full-width">
                            <label for="valor_total">Valor Total (KZS) *</label>
                            <input type="number" id="valor_total" name="valor_total" step="0.01" required>
                        </div>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-save"></i> Criar Reserva
                        </button>
                    </form>
                </div>

               
                <div class="table-container">
                    <h2>📋 Reservas Ativas</h2>
                    <div class="table-actions">
                        <select id="filtroStatus">
                            <option value="">Todos os Status</option>
                            <option value="Pendente">Pendente</option>
                            <option value="Confirmada">Confirmada</option>
                            <option value="Check-in">Check-in</option>
                            <option value="Check-out">Check-out</option>
                            <option value="Cancelada">Cancelada</option>
                        </select>
                        <input type="text" id="searchReservas" placeholder="🔍 Pesquisar reservas..." class="search-input">
                    </div>
                    <table id="reservasTable">
                        <thead>
                            <tr>
                                <th>Cliente</th>
                                <th>Quarto</th>
                                <th>Check-in</th>
                                <th>Check-out</th>
                                <th>Valor</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="api.js"></script>
    <script src="reservas.js"></script>
    
</body>
</html>
