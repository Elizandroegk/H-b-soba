<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamentos - Hospedaria B-SOBA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="admin-wrapper">
        
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-home"></i> B-SOBA Admin</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
                <a href="clientes.html" class="nav-item">
                    <i class="fas fa-users"></i> Clientes
                </a>
                <a href="quartos.html" class="nav-item">
                    <i class="fas fa-bed"></i> Quartos
                </a>
                <a href="reservas.html" class="nav-item">
                    <i class="fas fa-calendar-check"></i> Reservas
                </a>
                <a href="pagamentos.html" class="nav-item active">
                    <i class="fas fa-credit-card"></i> Pagamentos
                </a>
                <a href="relatorios.html" class="nav-item">
                    <i class="fas fa-chart-bar"></i> Relatórios
                </a>
                <a href="index.html" class="nav-item logout">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <h1>💳 Gestão de Pagamentos</h1>
                <div class="user-info">
                    <span>Bem-vindo, Admin</span>
                    <i class="fas fa-user-circle"></i>
                </div>
            </header>

            <div class="admin-container">
                
                <div class="table-container">
                    <h2>➕ Registrar Pagamento</h2>
                    <form id="pagamentoForm" class="form-grid">
                        <div class="form-group">
                            <label for="id_reserva">Reserva *</label>
                            <select id="id_reserva" name="id_reserva" required>
                                <option value="">Selecione reserva...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="valor_pago">Valor Pago (KZS) *</label>
                            <input type="number" id="valor_pago" name="valor_pago" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="metodo_pagamento">Método *</label>
                            <select id="metodo_pagamento" name="metodo_pagamento" required>
                                <option value="">Selecione...</option>
                                <option value="Dinheiro">💵 Dinheiro</option>
                                <option value="Cartão">💳 Cartão</option>
                                <option value="Transferência">🏦 Transferência</option>
                                <option value="M-Pesa">📱 M-Pesa</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-save"></i> Registrar Pagamento
                        </button>
                    </form>
                </div>

                
                <div class="table-container">
                    <h2>💰 Histórico de Pagamentos</h2>
                    <div class="table-actions">
                        <input type="date" id="filtroData" class="date-filter">
                        <input type="text" id="searchPagamentos" placeholder="🔍 Pesquisar pagamentos..." class="search-input">
                    </div>
                    <table id="pagamentosTable">
                        <thead>
                            <tr>
                                <th>Reserva</th>
                                <th>Cliente</th>
                                <th>Valor</th>
                                <th>Método</th>
                                <th>Data</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="api.js"></script>
    <script src="pagamentos.js"></script>
    
</body>
</html>
