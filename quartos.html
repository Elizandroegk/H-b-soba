<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quartos - Hospedaria B-SOBA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="admin-wrapper">
 
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-home"></i> B-SOBA Admin</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
                <a href="clientes.html" class="nav-item">
                    <i class="fas fa-users"></i> Clientes
                </a>
                <a href="quartos.html" class="nav-item active">
                    <i class="fas fa-bed"></i> Quartos
                </a>
                <a href="reservas.html" class="nav-item">
                    <i class="fas fa-calendar-check"></i> Reservas
                </a>
                <a href="pagamentos.html" class="nav-item">
                    <i class="fas fa-credit-card"></i> Pagamentos
                </a>
                <a href="relatorios.html" class="nav-item">
                    <i class="fas fa-chart-bar"></i> Relatórios
                </a>
                <a href="index.html" class="nav-item logout">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <h1>🛏️ Gestão de Quartos</h1>
                <div class="user-info">
                    <span>Bem-vindo, Admin</span>
                    <i class="fas fa-user-circle"></i>
                </div>
            </header>

            <div class="admin-container">
              
                <div class="table-container">
                    <h2>➕ Novo Quarto</h2>
                    <form id="quartoForm" class="form-grid">
                        <div class="form-group">
                            <label for="numero">Número do Quarto *</label>
                            <input type="text" id="numero" name="numero" placeholder="ex: 101" required>
                        </div>
                        <div class="form-group">
                            <label for="tipo">Tipo *</label>
                            <select id="tipo" name="tipo" required>
                                <option value="">Selecione...</option>
                                <option value="Standard">Standard</option>
                                <option value="Premium">Premium</option>
                                <option value="Suite">Suite</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="preco_diaria">Preço Diária (KZS) *</label>
                            <input type="number" id="preco_diaria" name="preco_diaria" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="status">Status *</label>
                            <select id="status" name="status" required>
                                <option value="Disponível">✅ Disponível</option>
                                <option value="Ocupado">⏳ Ocupado</option>
                                <option value="Manutenção">🔧 Manutenção</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-save"></i> Cadastrar Quarto
                        </button>
                    </form>
                </div>

                
                <div class="table-container">
                    <h2>🏨 Quartos Cadastrados</h2>
                    <div class="table-actions">
                        <input type="text" id="searchQuartos" placeholder="🔍 Pesquisar quartos..." class="search-input">
                    </div>
                    <table id="quartosTable">
                        <thead>
                            <tr>
                                <th>Número</th>
                                <th>Tipo</th>
                                <th>Preço/Diária</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                         
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="api.js"></script>
    <script src="quartos.js"></script>
   
</body>
</html>
